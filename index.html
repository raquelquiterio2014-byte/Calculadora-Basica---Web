<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🔢 Calculadora</h1>

        <input type="number" step="any" id="num1" aria-label="Primeiro número" placeholder="Digite o primeiro número">
        <input type="number" step="any" id="num2" aria-label="Segundo número" placeholder="Digite o segundo número">

        <select id="operacao">
            <option value="soma">Soma</option>
            <option value="sub">Subtração</option>
            <option value="mult">Multiplicação</option>
            <option value="div">Divisão</option>
            <option value="quad">Quadrado</option>
            <option value="cubo">Cubo</option>
            <option value="raiz">Raiz quadrada</option>
        </select>

        <button onclick="calcular()">Calcular</button>

        <h2 id="resultado">Resultado: </h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
